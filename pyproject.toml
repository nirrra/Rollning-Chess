[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rolling-chess"
version = "0.1.0"
description = "A horizontal-cylinder chess variant rules engine and local game UI."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Rolling Chess Contributors" }
]
dependencies = [
  "fastapi>=0.110",
  "numpy>=1.24",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
ai = [
  "torch>=2.2",
]
windows = [
  "pyinstaller>=6.0",
]

[project.scripts]
rolling-chess = "rolling_chess.cli:main"
rolling-chess-ai = "rolling_chess.ai.cli:main"
rolling-chess-play = "rolling_chess.launcher:main"
rolling-chess-web = "rolling_chess.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
