<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rolling Chess</title>
    <link rel="stylesheet" href="/src/styles.css">
  </head>
  <body>
    <main class="app">
      <section class="board-shell" aria-label="Rolling Chess board">
        <div id="files-top" class="files top" aria-hidden="true"></div>
        <div class="play-area">
          <div class="ranks" aria-hidden="true">
            <span>8</span><span>7</span><span>6</span><span>5</span>
            <span>4</span><span>3</span><span>2</span><span>1</span>
          </div>
          <div id="board" class="board" role="grid" aria-label="Chess board"></div>
          <div class="ranks" aria-hidden="true">
            <span>8</span><span>7</span><span>6</span><span>5</span>
            <span>4</span><span>3</span><span>2</span><span>1</span>
          </div>
        </div>
        <div id="files-bottom" class="files" aria-hidden="true"></div>
        <div class="file-rotation">
          <label for="left-file">Left file: <span id="left-file-label">A</span></label>
          <input id="left-file" type="range" min="0" max="7" step="1" value="0">
        </div>
      </section>

      <aside class="side-panel">
        <header>
          <h1>Rolling Chess</h1>
          <div id="status" class="status">Starting</div>
        </header>
        <div class="actions" aria-label="Game actions">
          <button id="new-game" type="button">New</button>
          <button id="undo" type="button">Undo</button>
          <button id="redo" type="button">Redo</button>
          <button id="save" type="button">Save</button>
          <button id="load" type="button">Load</button>
        </div>
        <section class="captured-panel" aria-label="Captured pieces">
          <div class="captured-row">
            <span class="captured-label">White captured</span>
            <span id="white-captured" class="captured-pieces" aria-live="polite">-</span>
          </div>
          <div class="captured-row">
            <span class="captured-label">Black captured</span>
            <span id="black-captured" class="captured-pieces" aria-live="polite">-</span>
          </div>
        </section>
        <ol id="history" class="history" aria-label="Move history"></ol>
      </aside>
    </main>

    <div id="promotion" class="promotion hidden" role="dialog" aria-modal="true">
      <div class="promotion-box">
        <button data-piece="q" type="button">Queen</button>
        <button data-piece="r" type="button">Rook</button>
        <button data-piece="b" type="button">Bishop</button>
        <button data-piece="n" type="button">Knight</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
